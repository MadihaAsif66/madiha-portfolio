<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#3b1d6e" />
      <stop offset="100%" stop-color="#210f3c" />
    </linearGradient>
    <linearGradient id="goldPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#c084fc" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#goldPinkGrad)" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.5" />

  <!-- Monogram MA -->
  <text x="60" y="72" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="url(#goldPinkGrad)" letter-spacing="-1.5" filter="url(#glow)">MA</text>
  
  <!-- Sparkle Accent -->
  <circle cx="86" cy="34" r="3" fill="#fbcfe8" />
  <circle cx="34" cy="84" r="2" fill="#c084fc" />
</svg>